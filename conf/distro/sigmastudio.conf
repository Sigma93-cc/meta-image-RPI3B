require conf/distro/poky.conf


DISTRO = "sigmastudio"
DISTRO_NAME = "Embedded Linux distro provided by SigmaStudio as SigovAS for ${MACHINE} "
DISTRO_VERSION := "${@bb.process.run('git describe --tags --always --dirty',cwd=d.getVar('LAYERDIR_meta-my'))[0].strip() or '0.0.0'}"

DISTRO_FEATURES:append = " usrmerge systemd"
DISTRO_FEATURES:remove = "x11 opengl wayland"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""
VIRTUAL-RUNTIME_login_manager = "shadow-base"

VIRTUAL-RUNTIME_base-utils = "packagegroup-core-base-utils"
VIRTUAL-RUNTIME_base-utils-hwclock = "util-linux-hwclock"
VIRTUAL-RUNTIME_base-utils-syslog = "rsyslog"
PREFERRED_PROVIDER_virtual/base-utils-shell = "bash"
PACKAGE_EXCLUDE += "busybox busybox-syslog"

DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
TOOLCHAIN_HOST_TASK:append = " nativesdk-packagegroup-qt5-toolchain-host"
TOOLCHAIN_TARGET_TASK:append= " qtbase-dev qtbase-mkspecs"
PACKAGE_CLASSES = "package_deb"